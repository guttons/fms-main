<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Dark Background for PWA Android Launch Screen -->
  <rect width="512" height="512" fill="#0b121f"/>
  
  <!-- Outer subtle glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#56c8eb" stroke-width="2" opacity="0.2"/>
  
  <!-- Hexagon frame (scaled to fit Android maskable icon safe zone) -->
  <path 
    d="M256 127 L368 191 V321 L256 385 L144 321 V191 Z" 
    stroke="#56c8eb" 
    stroke-width="20" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
  />
  
  <!-- Fuel droplet -->
  <path 
    d="M256 180 C256 180 214 236 214 270 C214 293.192 232.808 312 256 312 C279.192 312 298 293.192 298 270 C298 236 256 180 256 180 Z" 
    fill="#56c8eb"
  />
  
  <!-- Hexagon nodes (fully within safe zone boundary) -->
  <circle cx="256" cy="127" r="14" fill="#56c8eb"/>
  <circle cx="368" cy="191" r="14" fill="#56c8eb"/>
  <circle cx="368" cy="321" r="14" fill="#56c8eb"/>
  <circle cx="256" cy="385" r="14" fill="#56c8eb"/>
  <circle cx="144" cy="321" r="14" fill="#56c8eb"/>
  <circle cx="144" cy="191" r="14" fill="#56c8eb"/>
</svg>
