    <style id="splash-styles">
      :root {
        --splash-bg: #f7f9fb;
        --splash-text: #191c1e;
        --splash-primary: #002046;
      }
      [data-theme='dark'] {
        --splash-bg: #0f1623;
        --splash-text: #f8fafc;
        --splash-primary: #56c8eb;
      }
      
      .splash-hex-draw {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawHex 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards infinite;
      }
      
      @keyframes drawHex {
        0% { stroke-dashoffset: 400; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      
      .splash-drop-pulse {
        transform-origin: 60px 60px;
        animation: breathe 2s ease-in-out infinite;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(0.9); opacity: 0.85; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      
      .splash-glow-pulse {
        transform-origin: 60px 60px;
        animation: glowPulse 2s ease-in-out infinite;
      }
      
      @keyframes glowPulse {
        0%, 100% { transform: scale(0.75); opacity: 0.35; }
        50% { transform: scale(1.2); opacity: 0.75; }
      }
      
      .splash-bar {
        animation: slideBar 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      
      @keyframes slideBar {
        0% { left: -50%; }
        100% { left: 100%; }
      }
      
      .splash-node {
        opacity: 0.2;
        transform-origin: center;
        animation: nodePulse 1.8s ease-in-out infinite;
      }
      .node-1 { animation-delay: 0s; transform-origin: 60px 15px; }
      .node-2 { animation-delay: 0.3s; transform-origin: 100px 38px; }
      .node-3 { animation-delay: 0.6s; transform-origin: 100px 82px; }
      .node-4 { animation-delay: 0.9s; transform-origin: 60px 105px; }
      .node-5 { animation-delay: 1.2s; transform-origin: 20px 82px; }
      .node-6 { animation-delay: 1.5s; transform-origin: 20px 38px; }
      
      @keyframes nodePulse {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.4); }
      }
    </style>
</head>
  <body class="font-sans antialiased overflow-hidden">
    <div id="pwa-splash" style="position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--splash-bg); transition: opacity 0.5s ease, visibility 0.5s ease;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
        <!-- Animated SVG Logo -->
        <div style="width: 96px; height: 96px; position: relative;">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <radialGradient id="splash-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#019BC9" stop-opacity="0.4" />
                <stop offset="100%" stop-color="#019BC9" stop-opacity="0" />
              </radialGradient>
            </defs>
            <circle cx="60" cy="60" r="50" fill="url(#splash-glow)" class="splash-glow-pulse" />
            
            <!-- Hexagon frame -->
            <path 
              d="M60 15 L100 38 V82 L60 105 L20 82 V38 Z" 
              stroke="#019BC9" 
              stroke-width="7" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              class="splash-hex-draw"
            />
            
            <!-- Droplet -->
            <path 
              d="M60 35 C60 35 45 55 45 65 C45 73.284 51.716 80 60 80 C68.284 80 75 73.284 75 65 C75 55 60 35 60 35 Z" 
              fill="#019BC9" 
              class="splash-drop-pulse"
            />
            
            <!-- Hexagon Nodes -->
            <circle cx="60" cy="15" r="6" fill="#019BC9" class="splash-node node-1" />
            <circle cx="100" cy="38" r="6" fill="#019BC9" class="splash-node node-2" />
            <circle cx="100" cy="82" r="6" fill="#019BC9" class="splash-node node-3" />
            <circle cx="60" cy="105" r="6" fill="#019BC9" class="splash-node node-4" />
            <circle cx="20" cy="82" r="6" fill="#019BC9" class="splash-node node-5" />
            <circle cx="20" cy="38" r="6" fill="#019BC9" class="splash-node node-6" />
          </svg>
        </div>
        
        <!-- Loading Text -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <h2 style="font-size: 11px; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; color: var(--splash-text); margin: 0; font-family: 'Inter', system-ui, sans-serif;">FUEL SERVICES</h2>
          <div style="width: 64px; height: 2px; background-color: rgba(1, 155, 201, 0.15); border-radius: 9999px; overflow: hidden; position: relative;">
            <div style="position: absolute; top: 0; bottom: 0; background-color: #019BC9; width: 32px; border-radius: 9999px;" class="splash-bar"></div>
          </div>
        </div>
      </div>
    </div>

      window.addEventListener('load', () => {

          console.log('SW registration failed: ', registrationError);
        });
