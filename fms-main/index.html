    <style id="splash-styles">
      :root {
        --splash-bg: #0b121f;
        --splash-text: #ffffff;
        --splash-primary: #019BC9;
      }
      [data-theme='light'] {
        --splash-bg: #f7f9fb;
        --splash-text: #191c1e;
        --splash-primary: #002046;
      }
      [data-theme='dark'] {
        --splash-bg: #0b121f;
        --splash-text: #f8fafc;
        --splash-primary: #019BC9;
      }
      [data-theme='black'] {
        --splash-bg: #0E0E0E;
        --splash-text: #ffffff;
        --splash-primary: #019BC9;
      }
      
      html, body {
        background-color: #0b121f;
        color: #ffffff;
      }

      .splash-hex-draw {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawHex 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards infinite;
      }
      
      @keyframes drawHex {
        0% { stroke-dashoffset: 400; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      
      .splash-drop-pulse {
        transform-origin: 60px 60px;
        animation: breathe 2s ease-in-out infinite;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(0.9); opacity: 0.85; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      
      .splash-glow-pulse {
        transform-origin: 60px 60px;
        animation: glowPulse 2s ease-in-out infinite;
      }
      
      @keyframes glowPulse {
        0%, 100% { transform: scale(0.75); opacity: 0.35; }
        50% { transform: scale(1.2); opacity: 0.75; }
      }
      
      .splash-bar {
        animation: slideBar 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      
      @keyframes slideBar {
        0% { left: -50%; }
        100% { left: 100%; }
      }
      
      .splash-node {
        opacity: 0.3;
        animation: nodePulse 1.8s ease-in-out infinite;
      }
      .node-1 { animation-delay: 0s; transform-origin: 60px 22px; }
      .node-2 { animation-delay: 0.3s; transform-origin: 94px 41px; }
      .node-3 { animation-delay: 0.6s; transform-origin: 94px 79px; }
      .node-4 { animation-delay: 0.9s; transform-origin: 60px 98px; }
      .node-5 { animation-delay: 1.2s; transform-origin: 26px 79px; }
      .node-6 { animation-delay: 1.5s; transform-origin: 26px 41px; }
      
      @keyframes nodePulse {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.4); }
      }
    </style>
</head>
  <body class="font-sans antialiased overflow-hidden bg-[#0b121f]">
    <div id="pwa-splash" style="position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--splash-bg, #0b121f); transition: opacity 0.5s ease, visibility 0.5s ease;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
        <!-- Animated SVG Logo (Scaled to prevent corner circle clipping) -->
        <div style="width: 100px; height: 100px; position: relative;">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
              <radialGradient id="splash-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#019BC9" stop-opacity="0.4" />
                <stop offset="100%" stop-color="#019BC9" stop-opacity="0" />
              </radialGradient>
            </defs>
            <circle cx="60" cy="60" r="52" fill="url(#splash-glow)" class="splash-glow-pulse" />
            
            <!-- Hexagon frame -->
            <path 
              d="M60 22 L94 41 V79 L60 98 L26 79 V41 Z" 
              stroke="#019BC9" 
              stroke-width="6" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              class="splash-hex-draw"
            />
            
            <!-- Droplet -->
            <path 
              d="M60 38 C60 38 48 54 48 62 C48 68.6 53.4 74 60 74 C66.6 74 72 68.6 72 62 C72 54 60 38 60 38 Z" 
              fill="#019BC9" 
              class="splash-drop-pulse"
            />
            
            <!-- Hexagon Nodes (Unclipped) -->
            <circle cx="60" cy="22" r="4.5" fill="#019BC9" class="splash-node node-1" />
            <circle cx="94" cy="41" r="4.5" fill="#019BC9" class="splash-node node-2" />
            <circle cx="94" cy="79" r="4.5" fill="#019BC9" class="splash-node node-3" />
            <circle cx="60" cy="98" r="4.5" fill="#019BC9" class="splash-node node-4" />
            <circle cx="26" cy="79" r="4.5" fill="#019BC9" class="splash-node node-5" />
            <circle cx="26" cy="41" r="4.5" fill="#019BC9" class="splash-node node-6" />
          </svg>
        </div>
        
        <!-- Loading Text -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span style="font-size: 8px; font-weight: 900; letter-spacing: 0.35em; text-transform: uppercase; color: #019BC9; opacity: 0.8; font-family: 'Inter', system-ui, sans-serif;">MALDIVES AIRPORTS CO LTD</span>
          <h2 style="font-size: 13px; font-weight: 900; letter-spacing: 0.25em; text-transform: uppercase; color: var(--splash-text, #ffffff); margin: 0; font-family: 'Inter', system-ui, sans-serif;">AVIATION FUEL SERVICES</h2>
          <div style="width: 72px; height: 2.5px; background-color: rgba(1, 155, 201, 0.15); border-radius: 9999px; overflow: hidden; position: relative; margin-top: 4px;">
            <div style="position: absolute; top: 0; bottom: 0; background-color: #019BC9; width: 36px; border-radius: 9999px;" class="splash-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
