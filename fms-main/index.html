<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>MACL FMS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#019BC9" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              surface: 'var(--color-surface)',
              'surface-dim': 'var(--color-surface-dim)',
              'surface-lowest': 'var(--color-surface-container-lowest)',
              'surface-container': 'var(--color-surface-container-low)',
              'surface-container-low': 'var(--color-surface-container-low)',
              'surface-container-lowest': 'var(--color-surface-container-lowest)',
              'surface-container-highest': 'var(--color-surface-container-highest)',
              on: {
                surface: 'var(--color-on-surface)',
                'surface-dim': 'var(--color-on-surface-dim)',
              },
              primary: {
                DEFAULT: 'var(--color-primary)',
                container: 'var(--color-primary-container)',
              },
              tertiary: 'var(--color-tertiary)',
              error: 'var(--color-error)',
              success: 'var(--color-success)',
              warning: 'var(--color-warning)',
              outline: 'var(--color-outline)',
              'outline-variant': 'var(--color-outline-variant)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              ambient: 'var(--shadow-md)',
              premium: 'var(--shadow-premium)',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for dashboards */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-outline); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-on-surface-dim); 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="font-sans antialiased overflow-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('SW registered: ', registration);
        }).catch(registrationError => {
          console.log('SW registration failed: ', registrationError);
        });
      });
    }
  </script>
</body>
</html>
